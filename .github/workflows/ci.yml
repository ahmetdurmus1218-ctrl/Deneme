name: ci
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Policy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: models.lock.json schema
        run: |
          if [ -f models.lock.json ]; then python3 tools/check-lock-schema.py models.lock.json; else echo "models.lock.json not generated yet"; fi
      - name: No network code in :core
        run: bash tools/check-core-no-network.sh

  build:
    name: Build, test, lint (Android + JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon :core:jvmTest :ui:jvmTest :desktopApp:jvmTest
      - name: Android lint
        run: ./gradlew --no-daemon :androidApp:lintRelease :gate:lintRelease
      - name: Build APKs
        run: ./gradlew --no-daemon :androidApp:assembleRelease :gate:assembleRelease
      - name: Kale has no INTERNET permission
        run: bash tools/check-no-internet.sh androidApp/build/outputs/apk/release/androidApp-release.apk gate/build/outputs/apk/release/gate-release.apk
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            androidApp/build/outputs/apk/release/*.apk
            gate/build/outputs/apk/release/*.apk
          retention-days: 7

  windows:
    name: Windows MSI
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Package MSI
        shell: bash
        run: ./gradlew --no-daemon :desktopApp:packageMsi
      - name: jpackage logs
        if: failure()
        shell: bash
        run: |
          for f in desktopApp/build/compose/logs/*/*.txt; do echo "=== $f"; tail -n 80 "$f"; done || true
      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          retention-days: 7
