name: ci
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Policy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: models.lock.json schema
        run: |
          if [ -f models.lock.json ]; then python3 tools/check-lock-schema.py models.lock.json; else echo "models.lock.json not generated yet"; fi
      - name: No network code in :core
        run: bash tools/check-core-no-network.sh

  build:
    name: Build, test, lint (Android + JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Whisper files for the PC microphone test (from models.lock.json, SHA-256 checked)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/whisper
          key: voice-files-${{ hashFiles('models.lock.json') }}
      - run: python3 tools/fetch-models.py "$RUNNER_TEMP/whisper" stt-whisper-small tts-piper-tr
      - name: Unit tests (core, ui, desktop incl. UI walkthrough, gate)
        env:
          JARVIS_WHISPER_DIR: ${{ runner.temp }}/whisper
          JARVIS_PIPER_ARCHIVE: ${{ runner.temp }}/whisper/vits-piper-tr_TR-dfki-medium.tar.bz2
        run: ./gradlew --no-daemon :core:jvmTest :ui:jvmTest :desktopApp:jvmTest :gate:testDebugUnitTest
      - name: Desktop UI walkthrough (text of every screen)
        if: always()
        run: |
          for f in desktopApp/build/ui-screens/*.txt; do
            [ -f "$f" ] || continue
            echo "=== $(basename "$f" .txt): $(cat "$f")"
          done
      - name: Desktop UI screenshots as text (base64, for reviewing the design from the log)
        if: always()
        run: |
          for f in 27-el-kontrolu-dar 28-el-kontrolu-el 29-el-efekt-ayarlari-dar 30-el-efektler-dar 02c-sohbet-karsilama 26-gorunumler 20-yuz-bekliyor 21-yuz-dinliyor 22-yuz-dusunuyor 23-yuz-konusuyor 24-yuz-uyuyor 25-yuz-kucuk 03-sohbet-hesap 08a-ev-kahve 08b-ev-paneli 08c-kitaplik 08d-brifing 08e-tema-mark3 08f-tema-gunisigi 17-mark2 09-el-kontrolu 09-el-ates 10-el-muhur 11-el-gezegen 12-el-iki-elle 13-el-patlama 14-el-simsek 15-el-isik-izi 16-el-efekt-ayarlari; do
            p="desktopApp/build/ui-screens/$f.jpg"
            [ -f "$p" ] || continue
            echo "=== IMG $f"; base64 -w0 "$p"; echo; echo "=== END $f"
          done
      - name: Upload desktop UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screens
          path: desktopApp/build/ui-screens/
          if-no-files-found: ignore
          retention-days: 7
      - name: Android lint
        run: ./gradlew --no-daemon :androidApp:lintRelease :gate:lintRelease
      - name: Build APKs
        run: ./gradlew --no-daemon :androidApp:assembleRelease :androidApp:assembleReleaseAndroidTest :gate:assembleRelease
      - name: Kale has no INTERNET permission
        run: |
          bash tools/check-no-internet.sh androidApp/build/outputs/apk/release/androidApp-arm64-v8a-release.apk gate/build/outputs/apk/release/gate-release.apk
          bash tools/check-no-internet.sh androidApp/build/outputs/apk/release/androidApp-x86_64-release.apk
          ls -la androidApp/build/outputs/apk/release/ gate/build/outputs/apk/release/
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            androidApp/build/outputs/apk/release/*.apk
            androidApp/build/outputs/apk/androidTest/release/*.apk
            gate/build/outputs/apk/release/*.apk
          retention-days: 7

  android-smoke:
    name: Android emulator end-to-end
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, check permissions, run, download through Kapı
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 tools/android-smoke.py apks --download
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-shots
          path: smoke-shots/
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: Windows MSI
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Whisper files for the PC microphone test
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/whisper
          key: voice-files-${{ hashFiles('models.lock.json') }}
      - shell: bash
        run: python tools/fetch-models.py "$RUNNER_TEMP/whisper" stt-whisper-small tts-piper-tr
      - name: kiwix-tools (locked Windows build) and a small real Wikipedia ZIM for the kiwix-serve test
        shell: bash
        run: |
          python tools/fetch-models.py "$RUNNER_TEMP/kiwix" bin-kiwix
          python tools/fetch-test-zim.py "$RUNNER_TEMP/kiwix/test.zim"
          echo "JARVIS_KIWIX_ZIP=$(ls "$RUNNER_TEMP"/kiwix/kiwix-tools_*.zip)" >> "$GITHUB_ENV"
          echo "JARVIS_TEST_ZIM=$RUNNER_TEMP/kiwix/test.zim" >> "$GITHUB_ENV"
      - name: Desktop tests on Windows (Whisper with the Windows DLLs, real kiwix-serve) and MSI
        shell: bash
        env:
          JARVIS_WHISPER_DIR: ${{ runner.temp }}/whisper
          JARVIS_PIPER_ARCHIVE: ${{ runner.temp }}/whisper/vits-piper-tr_TR-dfki-medium.tar.bz2
          JARVIS_FIREWALL_TEST: "1"
        run: ./gradlew --no-daemon :desktopApp:jvmTest :desktopApp:packageMsi
      - name: rick-kapi.exe from the app image downloads a locked file by itself; the MSI contains it
        shell: bash
        run: |
          app=desktopApp/build/compose/binaries/main/app/Rick
          ls "$app" "$app/app" | head -40
          "$app/rick-kapi.exe" --item stt-whisper-small-tokens --partial "$RUNNER_TEMP/kapi" | tee kapi.out | tail -3
          grep -q "^DONE " kapi.out
          # Refusing is an error exit by design; only its message is checked.
          refused=$("$app/rick-kapi.exe" --item not-in-the-lock --partial "$RUNNER_TEMP/kapi" || true)
          echo "$refused"
          echo "$refused" | grep -q "kilit dosyasında olmayan"
          msi=$(ls desktopApp/build/compose/binaries/main/msi/*.msi)
          msiexec //a "$(cygpath -w "$msi")" //qn TARGETDIR="$(cygpath -w "$RUNNER_TEMP/msi-x")"
          sleep 5
          find "$RUNNER_TEMP/msi-x" -iname "rick-kapi*" | tee found.txt
          grep -qi "rick-kapi.exe" found.txt && grep -qi "rick-kapi.cfg" found.txt
      - name: Desktop test output (Windows)
        if: always()
        shell: bash
        run: grep -h "Whisper (PC path)\|kiwix-serve\|Piper:\|Whisper heard\|firewall\|DPAPI" desktopApp/build/test-results/jvmTest/*.xml || true
      - name: jpackage logs
        if: failure()
        shell: bash
        run: |
          for f in desktopApp/build/compose/logs/*/*.txt; do echo "=== $f"; tail -n 80 "$f"; done || true
      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          retention-days: 7
