name: release
# Tag vX.Y.Z → jarvis.apk + jarvis-kapi.apk (same key) + Jarvis-Setup-X.Y.Z.msi + SHA256SUMS.txt
# Also runs when .github/release-request (one line: the tag, e.g. v0.1.0) changes on a branch:
# then the release and its tag are created on that commit.
on:
  push:
    tags: ['v*']
    branches: ['**']
    paths: ['.github/release-request']
  workflow_dispatch:
permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: t
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="$(tr -d '[:space:]' < .github/release-request)"; fi
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag '$TAG'"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  android:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      signing: ${{ steps.key.outputs.signing }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key (repository secrets, or the public CI test key)
        id: key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "JARVIS_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
              echo "JARVIS_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "JARVIS_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "JARVIS_KEY_PASSWORD=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "signing=release" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets: using the public ci-test.keystore"
            echo "signing=test" >> "$GITHUB_OUTPUT"
          fi
      - name: Test and build
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          V="${TAG#v}"
          ./gradlew --no-daemon -Pjarvis.version="$V" :core:jvmTest :ui:jvmTest :androidApp:assembleRelease :gate:assembleRelease
      - name: Kale has no INTERNET permission
        run: bash tools/check-no-internet.sh androidApp/build/outputs/apk/release/androidApp-release.apk gate/build/outputs/apk/release/gate-release.apk
      - name: Rename
        run: |
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/androidApp-release.apk dist/jarvis.apk
          cp gate/build/outputs/apk/release/gate-release.apk dist/jarvis-kapi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/

  windows:
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Package MSI
        shell: bash
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          V="${TAG#v}"
          ./gradlew --no-daemon -Pjarvis.version="$V" :desktopApp:jvmTest :desktopApp:packageMsi
          mkdir -p dist
          cp desktopApp/build/compose/binaries/main/msi/*.msi "dist/Jarvis-Setup-${V%%-*}.msi"
      - name: jpackage logs
        if: failure()
        shell: bash
        run: |
          for f in desktopApp/build/compose/logs/*/*.txt; do echo "=== $f"; tail -n 80 "$f"; done || true
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

  publish:
    needs: [meta, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release notes
        env:
          SIGNING: ${{ needs.android.outputs.signing }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          cp models.lock.json dist/
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          V="${TAG#v}"
          {
            if [ "$SIGNING" = "test" ]; then
              echo "> ⚠️ **Bu sürüm test anahtarıyla imzalı.** APK'lar depodaki herkese açık \`ci-test.keystore\` ile imzalandı. Kendi anahtarınızı eklemek için README'deki \"İmza anahtarı\" bölümüne bakın."
              echo
            fi
            if [ -f "docs/changelog/v$V.md" ]; then cat "docs/changelog/v$V.md"; else echo "Jarvis $V"; fi
            echo
            echo "### SHA-256"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          # The release may already exist when it was created from the GitHub web page (which also
          # creates the tag and starts this workflow): then only attach the files and the notes.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Jarvis ${TAG}" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Jarvis ${TAG}" --notes-file notes.md
          fi
